name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel an in-progress review for a PR when a new push arrives, so two
# reviews never run at once and pile duplicate comments onto the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Never review a PR while it is a draft. synchronize/reopened can fire on
    # draft PRs, so this guard (not the trigger list) is what enforces it.
    # ready_for_review means the review runs the moment a draft is marked ready.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full depth: the action tells the reviewer to diff against the
          # base branch, which a shallow clone cannot resolve — it then
          # burns turns on git fetch calls the allowlist refuses.
          fetch-depth: 0

      - name: Claude PR review (inline comments)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Posts a progress/summary tracking comment as the review runs.
          track_progress: true

          # Keep the model's output in the job log. Without this the action
          # hides it, and a failed review reports nothing but is_error:true —
          # which cost a long investigation once already. Runner debug mode
          # does NOT unhide it. The repo is public, so the log is public:
          # it holds the diff and the files the reviewer read, never secrets
          # (Actions masks those).
          show_full_output: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, logic errors, security issues,
            performance problems, and deviations from the project's conventions
            (see CLAUDE.md if present).

            Post your findings as INLINE review comments anchored to the exact
            changed lines, using the
            mcp__github_inline_comment__create_inline_comment tool. For each finding:
              - Anchor the comment to the specific file and line(s) it concerns.
              - When there is a concrete fix of a few lines or fewer, include a
                GitHub ```suggestion``` block with the exact replacement code so it
                can be applied directly from the PR.
            Use a single top-level comment (via `gh pr comment`) only for the
            overall summary or general praise — put specific issues inline, not in
            one big comment.

          # Read-only shell utilities are listed because a piped command is
          # approved part by part: `git diff | grep` fails on the grep half
          # alone, and the reviewer then burns turns working around it.
          #
          # --allowedTools must include the inline-comment tool, or the review
          # falls back to a single summary comment with no line-anchored comments.
          #
          # Model and effort are read from repository Variables so they can be
          # changed from the GitHub UI (Settings > Secrets and variables >
          # Actions > Variables) without editing this file. If a variable is
          # unset, the fallback after `||` is used, preserving current behavior.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(grep:*),Bash(awk:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(cat:*),Bash(ls:*)"
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
            --effort ${{ vars.CLAUDE_EFFORT || 'high' }}